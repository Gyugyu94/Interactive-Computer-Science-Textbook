<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10131d" />
    <meta name="description" content="CPU와 RAM부터 시작하는 개발자를 위한 인터랙티브 운영체제 강의." />
    <title>실행의 원리 · 운영체제 시각 강의</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#lesson">본문으로 바로 가기</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#week-1" data-route>
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span>실행의 원리</span>
        </a>
        <span class="header-topic">운영체제 시각 강의</span>
        <div class="keyboard-hint" id="keyboard-hint" aria-hidden="true" hidden>
          <kbd>←</kbd><kbd>→</kbd><span>화면 이동</span>
        </div>
        <a class="secondary-button catalog-link" id="back-to-catalog" href="#week-1" data-route hidden>강의 목록</a>
        <button class="secondary-button menu-button" type="button" aria-haspopup="dialog" aria-controls="mobile-toc" id="open-toc" hidden>
          <span class="menu-icon" aria-hidden="true"></span>목차
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar" aria-label="커리큘럼">
        <div class="sidebar-inner">
          <div id="week-sidebar">
            <div class="course">
              <p class="day-label" id="catalog-length"></p>
              <h2>커리큘럼</h2>
            </div>
            <nav class="toc week-toc" data-week-links aria-label="전체 주차"></nav>
          </div>
          <div id="slide-sidebar" hidden>
            <div class="course">
              <p class="day-label" id="sidebar-day"></p>
              <h2 id="sidebar-lesson-title"></h2>
              <div class="course-progress">
                <progress class="progress-track" data-progress value="1" aria-label="현재 강의 화면"></progress>
                <span data-position></span>
              </div>
            </div>
            <nav class="toc" data-toc aria-label="강의 화면"></nav>
          </div>
        </div>
      </aside>

      <main class="main" id="lesson">
        <noscript>강의를 보려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
        <section id="catalog" class="slide catalog" aria-labelledby="catalog-title" hidden>
          <header class="slide-intro">
            <h1 id="catalog-title" tabindex="-1">강의 목록</h1>
            <p class="lesson-description">프로그램의 실행부터 메모리, 커널, 네트워크를 거쳐 앱 성능까지 살펴봅니다.</p>
          </header>
          <nav class="mobile-weeks" data-week-links data-compact aria-label="전체 주차"></nav>
          <section class="week-panel" aria-labelledby="week-title">
            <header class="week-panel-header">
              <div>
                <p class="day-label" id="week-number"></p>
                <h2 id="week-title" tabindex="-1"></h2>
              </div>
              <p class="week-range" id="week-range"></p>
            </header>
            <ul class="day-list" id="day-list"></ul>
          </section>
          <nav class="slide-controls" aria-label="주차 이동">
            <button type="button" class="secondary-button back-button week-back" id="previous-week"><span aria-hidden="true">←</span> 이전 주차</button>
            <span class="slide-count" id="week-position"></span>
            <button type="button" class="primary-button" id="next-week">다음 주차 <span aria-hidden="true">→</span></button>
          </nav>
        </section>

        <article id="slide" class="slide" aria-labelledby="lesson-title" hidden>
          <header class="slide-intro">
            <p id="lesson-section" class="section-label"></p>
            <h1 id="lesson-title" tabindex="-1"></h1>
            <p id="lesson-description" class="lesson-description"></p>
          </header>

          <section class="figure" id="lesson-figure" aria-labelledby="figure-title">
            <div class="figure-header">
              <h2 id="figure-title"></h2>
              <span class="figure-count" id="figure-count" aria-hidden="true"></span>
            </div>
            <div class="scene" id="scene" aria-hidden="true"></div>
            <div class="figure-footer" id="figure-footer">
              <div class="step-caption" aria-live="polite" aria-atomic="true">
                <span id="step-label" class="step-label"></span>
                <p id="step-caption"></p>
              </div>
              <div class="step-actions">
                <div class="step-controls" id="step-controls">
                  <button class="secondary-button replay-button" id="replay" type="button"><span id="replay-icon" aria-hidden="true">▷</span><span id="replay-label">재생</span></button>
                  <button class="icon-button" id="previous-step" type="button" title="이전 단계 (Shift+←)" aria-label="이전 단계" aria-keyshortcuts="Shift+ArrowLeft">
                    <span aria-hidden="true">‹</span>
                  </button>
                  <button class="step-button" id="next-step" type="button" title="다음 단계 (Shift+→)" aria-keyshortcuts="Shift+ArrowRight">한 단계<span aria-hidden="true">›</span></button>
                </div>
                <p class="step-shortcuts"><span>단계 이동</span> <kbd>Shift</kbd> + <kbd>←</kbd> / <kbd>→</kbd></p>
              </div>
            </div>
          </section>

          <div id="lesson-extra" class="lesson-extra" hidden></div>

          <nav class="slide-controls" aria-label="강의 화면 이동">
            <button type="button" class="secondary-button back-button" id="previous-slide"><span aria-hidden="true">←</span> 이전</button>
            <span class="slide-count" id="slide-count"></span>
            <a class="primary-button" id="next-slide" href="#week-1" data-route>다음 화면 <span aria-hidden="true">→</span></a>
          </nav>
        </article>
      </main>
    </div>

    <dialog class="toc-dialog" id="mobile-toc" aria-labelledby="mobile-toc-title">
      <div class="dialog-header">
        <h2 id="mobile-toc-title"></h2>
        <button class="icon-button" type="button" id="close-toc" aria-label="목차 닫기"><span aria-hidden="true">×</span></button>
      </div>
      <div class="course-progress">
        <progress class="progress-track" data-progress value="1" aria-label="현재 강의 화면"></progress>
        <span data-position></span>
      </div>
      <nav class="toc" data-toc aria-label="강의 화면"></nav>
    </dialog>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
